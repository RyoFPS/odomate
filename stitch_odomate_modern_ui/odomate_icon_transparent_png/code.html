<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Arc Glow Gradient (kept for symbol fidelity or electric blue tone) -->
    <linearGradient id="arcGlowFlat" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Transparent Background (No gradient rect), isolated gauge icon mark -->
  <!-- Geometric Minimalist Gauge Symbol centered in 512x512 -->
  <g transform="translate(256, 256)" filter="url(#symbolShadow)">
    
    <!-- Outer Track Dial Tick Marks -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#2563EB" stroke-opacity="0.2" stroke-width="3" stroke-dasharray="4 10"/>
    
    <!-- Bold Main Odometer Sweep Arc (Dynamic 240 deg) -->
    <path d="M -108 92 A 142 142 0 1 1 108 92" 
          fill="none" 
          stroke="#2563EB" 
          stroke-width="22" 
          stroke-linecap="round"/>

    <!-- Subtle inner accent arc -->
    <path d="M -85 72 A 112 112 0 1 1 85 72" 
          fill="none" 
          stroke="#60A5FA" 
          stroke-opacity="0.35"
          stroke-width="6" 
          stroke-linecap="round"/>

    <!-- Guide Marks on the Gauge Arc -->
    <!-- 9 o'clock marker -->
    <line x1="-152" y1="0" x2="-130" y2="0" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
    <!-- Top marker (Peak speed/milestone) -->
    <line x1="0" y1="-152" x2="0" y2="-126" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
    <!-- 3 o'clock marker -->
    <line x1="130" y1="0" x2="152" y2="0" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>

    <!-- Central Disc Backplate -->
    <circle cx="0" cy="0" r="84" fill="#0F172A" stroke="#2563EB" stroke-width="3"/>

    <!-- Precision Speed Needle pointing sharply forward-upward (45 deg) -->
    <g transform="rotate(45)">
      <!-- Sleek needle blade -->
      <path d="M 0 -134 L 11 -44 L 0 -32 L -11 -44 Z" fill="#2563EB"/>
      <line x1="0" y1="-134" x2="0" y2="-48" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- Center Pivot Ring & Core Icon -->
    <circle cx="0" cy="0" r="34" fill="#FFFFFF" stroke="#0F172A" stroke-width="4"/>
    <circle cx="0" cy="0" r="20" fill="#2563EB"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>

  </g>
</svg>
