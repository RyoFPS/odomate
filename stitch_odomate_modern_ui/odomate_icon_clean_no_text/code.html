<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Rich Deep Electric Blue) -->
    <linearGradient id="bgGrad3" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Arc Glow Gradient -->
    <linearGradient id="arcGlow3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="rimGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Inner Shadow / Vignette -->
    <radialGradient id="innerGlow3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="appShadow3" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.32"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E40AF" flood-opacity="0.4"/>
    </filter>

    <filter id="coreGlow3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Squircle with Deep Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad3)" filter="url(#appShadow3)"/>

  <!-- Inner Ambient Lighting & Rim Border -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#innerGlow3)"/>
  <rect x="33" y="33" width="446" height="446" rx="103" fill="none" stroke="url(#rimGrad3)" stroke-width="2.5"/>

  <!-- Geometric Minimalist Gauge Symbol -->
  <g transform="translate(256, 256)">
    
    <!-- Outer Track Dial (Crisp tick marks ring) -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2.5" stroke-dasharray="3 8"/>
    
    <!-- Bold Main Odometer Sweep Arc (Dynamic 240 deg) -->
    <path d="M -98 84 A 130 130 0 1 1 98 84" 
          fill="none" 
          stroke="url(#arcGlow3)" 
          stroke-width="20" 
          stroke-linecap="round"
          filter="url(#coreGlow3)"/>

    <!-- Guide Marks on the Gauge Arc -->
    <!-- 9 o'clock marker -->
    <line x1="-140" y1="0" x2="-120" y2="0" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.45"/>
    <!-- Top marker (Peak speed/milestone) -->
    <line x1="0" y1="-140" x2="0" y2="-116" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- 3 o'clock marker -->
    <line x1="120" y1="0" x2="140" y2="0" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.45"/>

    <!-- Central Minimalist Back Plate for high contrast -->
    <circle cx="0" cy="0" r="78" fill="#0B132B" fill-opacity="0.45" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

    <!-- Precision Speed Needle pointing sharply forward-upward (45 deg) -->
    <g transform="rotate(45)">
      <!-- Sleek needle blade -->
      <path d="M 0 -124 L 10 -40 L 0 -30 L -10 -40 Z" fill="#FFFFFF" filter="url(#coreGlow3)"/>
      <line x1="0" y1="-124" x2="0" y2="-45" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Center Pivot Ring & Core Icon -->
    <circle cx="0" cy="0" r="32" fill="#0F172A" stroke="#FFFFFF" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="18" fill="#38BDF8"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>

  </g>
</svg>
